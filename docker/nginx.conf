# Configuración completa de nginx (sustituye a /etc/nginx/nginx.conf).
#
# Se reemplaza el archivo principal, y no solo el bloque `server`, para
# poder ajustar cuántos procesos y conexiones simultáneas admite: es lo
# que decide a cuánta gente se puede atender a la vez.

user nginx;

# Un proceso de trabajo por núcleo disponible en la máquina
worker_processes auto;
worker_rlimit_nofile 8192;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    # Conexiones simultáneas por proceso. Con 2 núcleos son ~4000
    # visitantes a la vez; de sobra para un sitio estático.
    worker_connections 2048;
    # Acepta todas las conexiones pendientes de golpe en vez de una a una
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # La imagen oficial enlaza estas rutas a stdout/stderr, así que los
    # logs salen por `docker logs` sin llenar el disco del contenedor.
    access_log /var/log/nginx/access.log;

    # Envía los archivos directamente desde el kernel, sin copiarlos a
    # memoria de usuario primero
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65;
    keepalive_requests 1000;

    # Oculta la versión de nginx en las cabeceras
    server_tokens off;

    # Evita reabrir los mismos archivos en cada petición
    open_file_cache max=1000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_proxied any;
    # Ni woff2 ni png entran aquí: ya vienen comprimidos y recomprimirlos
    # solo gastaría CPU por cada visita.
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Vite pone un hash en el nombre de cada asset, así que un archivo
        # dado nunca cambia de contenido: se puede cachear para siempre.
        #
        # Se usa solo add_header y no `expires`: la directiva `expires`
        # emite su propio Cache-Control y acabarían viajando dos cabeceras
        # contradictorias en la misma respuesta.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
            try_files $uri =404;
        }

        # Favicon e iconos no llevan hash y sí pueden cambiar entre
        # despliegues: una semana es un término medio razonable.
        location ~* \.(svg|png|ico)$ {
            add_header Cache-Control "public, max-age=604800";
            access_log off;
        }

        # El HTML nunca se cachea: es lo que apunta a los assets nuevos,
        # así que un despliegue se ve en cuanto se recarga.
        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        # Tampoco config.js, que el contenedor reescribe al arrancar con
        # las variables RN_*. No lleva hash en el nombre: si se cachea,
        # cambiar la disponibilidad no se notaría hasta que caduque.
        location = /config.js {
            add_header Cache-Control "no-cache";
        }

        # Cualquier ruta desconocida devuelve la SPA en lugar de un 404
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
